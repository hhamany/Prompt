<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Engineering Mastery — Ahmed Hamdy</title>
  <meta name="description" content="Reverse Engineering Language Models: From Text Crafting to Intelligent Systems Architecture" />
  <meta name="author" content="Ahmed Hamdy — Artificial Intelligence Engineer" />
  <link rel="stylesheet" href="style.css" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <!-- ══════════════════════════════════════
       LOADING OVERLAY
  ══════════════════════════════════════ -->
  <div class="loading-overlay" id="loadingOverlay">
    <div style="text-align: center;">
      <div class="loading-spinner"></div>
      <div class="loading-text">Initializing Presentation</div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       BACKGROUND LAYERS
  ══════════════════════════════════════ -->
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>
  <div class="bg-mesh"></div>

  <!-- ══════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">⚡</div>
        <div>
          <div class="sidebar-logo-text">Prompt Engineering</div>
          <span class="sidebar-logo-sub">Mastery · 70 Slides</span>
        </div>
      </div>

      <div class="sidebar-search">
        <span class="sidebar-search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search slides..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- Navigation Units & Slides -->
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Dynamically populated by app.js -->
    </nav>

    <!-- Footer Progress -->
    <div class="sidebar-footer">
      <div class="progress-bar-container">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progressText">1 / 70</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 1.43%"></div>
        </div>
      </div>
    </div>

  </aside>

  <!-- ══════════════════════════════════════
       MAIN AREA
  ══════════════════════════════════════ -->
  <main class="main-area" id="mainArea">

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Toggle Sidebar (S)">
          ☰
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <span class="unit-label" id="breadcrumbUnit">Introduction</span>
          <span class="separator">›</span>
          <span id="breadcrumbSlide">Title</span>
        </div>
      </div>

      <div class="top-bar-center">
        <div class="slide-counter">
          <span class="current" id="slideCounterCurrent">01</span>
          <span style="color: var(--text-muted); margin: 0 4px;">/</span>
          <span id="slideCounterTotal">70</span>
        </div>
      </div>

      <div class="top-bar-right">
        <button class="nav-btn" id="prevBtn" title="Previous (←)" disabled>‹</button>
        <button class="nav-btn" id="nextBtn" title="Next (→)">›</button>
        <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen (F)">⤢</button>
      </div>
    </header>

    <!-- SLIDES VIEWPORT -->
    <div class="slides-viewport" id="slidesViewport">
      <!-- Slides are dynamically rendered by app.js -->
    </div>

  </main>

  <!-- ══════════════════════════════════════
       KEYBOARD HINT
  ══════════════════════════════════════ -->
  <div class="keyboard-hint">
    <span class="key-badge">←</span>
    <span class="key-badge">→</span>
    Navigate
    <span style="margin: 0 6px; opacity: .4;">·</span>
    <span class="key-badge">S</span>
    Sidebar
    <span style="margin: 0 6px; opacity: .4;">·</span>
    <span class="key-badge">F</span>
    Fullscreen
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" style="display:none;"></div>

  <!-- ══════════════════════════════════════
       SCRIPTS
  ══════════════════════════════════════ -->
  <script src="script.js"></script>

</body>
</html>
